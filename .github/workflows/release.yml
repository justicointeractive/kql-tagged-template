name: Release VSIX

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.0.2. Leave empty to use/reuse the next patch version."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Package and publish GitHub release
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check release scripts
        run: npm run typecheck

      - name: Determine release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: npm run release:version

      - name: Set package version for VSIX
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm run release:set-package-version

      - name: Validate extension manifest
        run: npm run validate:manifest

      - name: Validate grammar JSON
        run: npm run validate:grammar

      - name: Package VSIX
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npx --yes @vscode/vsce package --out "kql-tagged-template-${VERSION}.vsix"

      - name: Create GitHub release and tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: "*.vsix"
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Upload packaged VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

  marketplace:
    name: Publish VS Code Marketplace
    runs-on: ubuntu-latest
    needs: release
    environment: vsce

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check release scripts
        run: npm run typecheck

      - name: Download packaged VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist

      - name: Verify Marketplace publisher
        env:
          PUBLISHER_ID: ${{ vars.PUBLISHER_ID }}
        run: npm run release:verify-publisher

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.PAT }}
        run: npx --yes @vscode/vsce publish --packagePath dist/*.vsix -p "$VSCE_PAT"
