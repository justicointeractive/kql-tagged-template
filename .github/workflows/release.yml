name: Release VSIX

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.0.2. Leave empty to use/reuse the next patch version."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Package and publish GitHub release
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          git fetch --tags origin
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const { execFileSync } = require('child_process');
          const fs = require('fs');

          const semverRe = /^v?(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/;
          const parse = (value) => {
            const match = String(value || '').trim().match(semverRe);
            if (!match) return null;
            return {
              value: String(value).trim().replace(/^v/, ''),
              major: Number(match[1]),
              minor: Number(match[2]),
              patch: Number(match[3]),
            };
          };
          const compare = (a, b) =>
            a.major - b.major || a.minor - b.minor || a.patch - b.patch;

          const input = parse(process.env.INPUT_VERSION);
          let selected = input;

          if (!selected) {
            const tagsAtHead = execFileSync('git', ['tag', '--points-at', 'HEAD'], { encoding: 'utf8' })
              .trim()
              .split(/\n/)
              .map(parse)
              .filter(Boolean)
              .sort(compare);

            if (tagsAtHead.length > 0) {
              selected = tagsAtHead[tagsAtHead.length - 1];
            } else {
              const packageVersion = parse(JSON.parse(fs.readFileSync('package.json', 'utf8')).version);
              const tags = execFileSync('git', ['tag', '--list', 'v[0-9]*.[0-9]*.[0-9]*'], { encoding: 'utf8' })
                .trim()
                .split(/\n/)
                .map(parse)
                .filter(Boolean);
              if (packageVersion) tags.push(packageVersion);
              const latest = tags.sort(compare).at(-1) || { major: 0, minor: 0, patch: 0 };
              selected = { major: latest.major, minor: latest.minor, patch: latest.patch + 1 };
              selected.value = `${selected.major}.${selected.minor}.${selected.patch}`;
            }
          }

          if (!selected) {
            throw new Error(`Invalid version input: ${process.env.INPUT_VERSION}`);
          }

          const tag = `v${selected.value}`;
          try {
            const taggedSha = execFileSync('git', ['rev-list', '-n', '1', tag], {
              encoding: 'utf8',
              stdio: ['ignore', 'pipe', 'ignore'],
            }).trim();
            const headSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            if (taggedSha !== headSha) {
              throw new Error(`${tag} already exists at ${taggedSha}, not ${headSha}`);
            }
          } catch (error) {
            if (error.status !== 128) throw error;
          }

          console.log(`version=${selected.value}`);
          console.log(`tag=${tag}`);
          NODE

      - name: Set package version for VSIX
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = process.env.VERSION;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Validate extension manifest
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"

      - name: Validate grammar JSON
        run: node -e "JSON.parse(require('fs').readFileSync('syntaxes/es6-inline-kql.json', 'utf8'))"

      - name: Package VSIX
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npx --yes @vscode/vsce package --out "kql-tagged-template-${VERSION}.vsix"

      - name: Create GitHub release and tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: "*.vsix"
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Upload packaged VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

  marketplace:
    name: Publish VS Code Marketplace
    runs-on: ubuntu-latest
    needs: release
    environment: vsce

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download packaged VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist

      - name: Verify Marketplace publisher
        env:
          PUBLISHER_ID: ${{ vars.PUBLISHER_ID }}
        run: |
          test -n "$PUBLISHER_ID"
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const expected = process.env.PUBLISHER_ID;
          if (pkg.publisher !== expected) {
            throw new Error(`package.json publisher (${pkg.publisher}) does not match vsce environment PUBLISHER_ID (${expected})`);
          }
          NODE

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.PAT }}
        run: npx --yes @vscode/vsce publish --packagePath dist/*.vsix -p "$VSCE_PAT"
